name: Live model check

# Manual only: Actions -> "Live model check" -> Run workflow.
# Sends test messages to the real Gemini and Groq APIs using your repository secrets
# GEMINI_API_KEY and GROQ_API_KEY, and writes a pass/fail summary on the run's page.
# It never runs on a normal push, so it does not use up your API quota.

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Which model to test"
        type: choice
        options:
          - both
          - gemini
          - groq
        default: both
      suite:
        description: "spec = your 12 messages (fast). all = 38 messages"
        type: choice
        options:
          - spec
          - all
        default: spec

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Run the live check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EVAL_PROVIDERS: ${{ inputs.providers }}
          EVAL_SUITE: ${{ inputs.suite }}
        run: npx tsx tests/live/run.ts
