name: DB tests

# Runs the schema, seed and SQL tests against a throwaway Postgres on every
# push. No local machine needed: open the Actions tab in GitHub to see results.

on:
  push:
  pull_request:

jobs:
  db:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      # Supabase provides these roles; plain Postgres does not.
      - name: Create Supabase-style roles
        run: psql -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin;"

      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Load seed data
        run: psql -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Phase 1 checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/verify_phase1.sql

      - name: Phase 2 engine tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/phase2_engine.sql
